name: Build unsigned iOS IPA

# Adapted from adro0303/ipa-builder (MIT) for in-repo use:
# builds an unsigned .ipa on GitHub's macOS runner so it can be
# re-signed with a free Apple ID via Sideloadly/AltStore on Windows.
# No Apple Developer account, no signing secrets, no Mac required.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SkiTracker
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install JS dependencies
        run: npm install

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Find workspace and scheme
        id: scheme
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          PROJECT=$(ls -d ios/*.xcodeproj | head -n1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          echo "Build products:"
          find build/DerivedData/Build/Products -maxdepth 2
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build products"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "ski-tracker-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ski-tracker-unsigned
          path: build/ski-tracker-unsigned.ipa
          retention-days: 14
